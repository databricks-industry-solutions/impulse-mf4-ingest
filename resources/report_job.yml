resources:
  jobs:
    MDA_Report:
      name: MDA_MF4_Report
      # Serverless in every target — the report is lightweight and independent of the
      # ingest job's compute. databricks-impulse is %pip-installed inside the notebook.
      environments:
        - environment_key: report_env
          spec:
            client: "4"
      tasks:
        - task_key: signal_report
          environment_key: report_env
          notebook_task:
            notebook_path: ../notebooks/reports/signal_report.py
            source: WORKSPACE
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

  dashboards:
    mdf_signal_report:
      display_name: MDF4 Signal Report
      file_path: ../dashboards/MDF_Report.lvdash.json
      warehouse_id: ${var.warehouse_id}
      # The dashboard's dataset queries use unqualified table names; these set the
      # default catalog/schema they resolve against (bundle ${var.*} placeholders are
      # not substituted inside .lvdash.json itself).
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.schema}
